name: Deploy XP remote API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XP_ADMIN_KEY: ${{ secrets.XP_ADMIN_KEY }}
      XP_DEVICE_KEY: ${{ secrets.XP_DEVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing repository secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$XP_ADMIN_KEY" || (echo "Missing repository secret XP_ADMIN_KEY" && exit 1)
          test -n "$XP_DEVICE_KEY" || (echo "Missing repository secret XP_DEVICE_KEY" && exit 1)
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Create or reuse D1 database
        id: d1
        run: |
          DB_ID="$(wrangler d1 list --json | jq -r '.[] | select(.name == "xp-battery-db") | .uuid' | head -n 1)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATE_JSON="$(wrangler d1 create xp-battery-db --json)"
            DB_ID="$(printf '%s' "$CREATE_JSON" | jq -r '.uuid // .result.uuid // empty')"
          fi
          test -n "$DB_ID" || (echo "Could not obtain D1 database ID" && exit 1)
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Apply database schema
        run: wrangler d1 execute xp-battery-db --remote --file=schema.sql
      - name: Configure API secrets
        run: |
          printf '%s' "$XP_ADMIN_KEY" | wrangler secret put ADMIN_KEY
          printf '%s' "$XP_DEVICE_KEY" | wrangler secret put DEVICE_KEY
      - name: Deploy Worker
        run: wrangler deploy
      - name: Report endpoint
        run: |
          echo "API endpoint: https://xp-battery-api.${CLOUDFLARE_ACCOUNT_ID}.workers.dev"
          echo "Verify it with: /health"
